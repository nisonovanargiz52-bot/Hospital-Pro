<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Pro | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h1>Hospital Pro</h1>
        <p>Tizimga kirish</p>

        <input type="text" id="username" placeholder="Login">
        <input type="password" id="password" placeholder="Parol">

        <select id="role">
            <option value="Registratura">Registratura</option>
            <option value="Shifokor">Shifokor</option>
            <option value="Boshliq">Boshliq</option>
        </select>

        <button onclick="login()">Kirish</button>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
